name: AmneziaWG
description: "Integrate AmneziaWG kernel module (out-of-tree) into the GKI source tree"

inputs:
  version:
    description: "GKI family, e.g. android14-6.1"
    required: true
  kernel_version:
    description: "Kernel version, e.g. 6.1"
    required: true
  sublevel:
    description: "Kernel sublevel, e.g. 138"
    required: true
  awg_ref:
    description: "AmneziaWG kernel module git ref (tag/branch/commit)"
    required: false
    default: "v1.0.20260725"   # 6.1 kernel ke liye AmneziaWG 2.0 line

runs:
  using: composite
  steps:
    - name: Clone AmneziaWG kernel module
      shell: bash
      run: |
        set -euo pipefail
        # Original AmneziaWG repository istemal ho rahi hai
        git clone --depth=1 --branch "${{ inputs.awg_ref }}" \
          https://github.com/amnezia-vpn/amneziawg-linux-kernel-module.git \
          "${RUNNER_TEMP}/amneziawg"
        echo "AmneziaWG checked out at: $(git -C "${RUNNER_TEMP}/amneziawg" rev-parse HEAD)"

    - name: Copy module source into kernel tree
      shell: bash
      run: |
        set -euo pipefail
        
        # Auto-detect kernel source directory
        if [ -d "${GITHUB_WORKSPACE}/kernel/common/drivers/net" ]; then
          KERNEL_SRC="${GITHUB_WORKSPACE}/kernel/common"
        elif [ -d "${GITHUB_WORKSPACE}/kernel_platform/common/drivers/net" ]; then
          KERNEL_SRC="${GITHUB_WORKSPACE}/kernel_platform/common"
        elif [ -d "${GITHUB_WORKSPACE}/common/drivers/net" ]; then
          KERNEL_SRC="${GITHUB_WORKSPACE}/common"
        elif [ -d "${GITHUB_WORKSPACE}/kernel/drivers/net" ]; then
          KERNEL_SRC="${GITHUB_WORKSPACE}/kernel"
        else
          echo "ERROR: Kernel source directory not found."
          exit 1
        fi
        
        echo "Using KERNEL_SRC: $KERNEL_SRC"
        DEST="${KERNEL_SRC}/drivers/net/amneziawg"
        mkdir -p "$DEST"
        
        # POORA repository copy karein (src ke sath sath compat bhi)
        cp -r "${RUNNER_TEMP}/amneziawg/." "$DEST/"
        rm -rf "${DEST}/.git"
        
        # Verify ke compat.h mojood hai
        if [ ! -f "${DEST}/compat/compat.h" ]; then
          echo "ERROR: compat/compat.h still missing!"
          ls -la "${DEST}"
          exit 1
        fi
        echo "compat/compat.h found. Module source copied successfully."
    - name: Register module in Kconfig/Makefile
      shell: bash
      run: |
        set -euo pipefail
        
        if [ -d "${GITHUB_WORKSPACE}/kernel_platform/common/drivers/net" ]; then
          KERNEL_SRC="${GITHUB_WORKSPACE}/kernel_platform/common"
        elif [ -d "${GITHUB_WORKSPACE}/kernel/common/drivers/net" ]; then
          KERNEL_SRC="${GITHUB_WORKSPACE}/kernel/common"
        elif [ -d "${GITHUB_WORKSPACE}/common/drivers/net" ]; then
          KERNEL_SRC="${GITHUB_WORKSPACE}/common"
        elif [ -d "${GITHUB_WORKSPACE}/kernel/drivers/net" ]; then
          KERNEL_SRC="${GITHUB_WORKSPACE}/kernel"
        else
          exit 1
        fi

        if ! grep -q 'amneziawg/Kconfig' "${KERNEL_SRC}/drivers/net/Kconfig"; then
          echo 'source "drivers/net/amneziawg/Kconfig"' >> "${KERNEL_SRC}/drivers/net/Kconfig"
        fi

        if ! grep -q 'amneziawg/' "${KERNEL_SRC}/drivers/net/Makefile"; then
          echo 'obj-$(CONFIG_AMNEZIAWG) += amneziawg/' >> "${KERNEL_SRC}/drivers/net/Makefile"
        fi
        echo "Successfully registered AmneziaWG in kernel build system."
    - name: Enable AmneziaWG in kernel config
      shell: bash
      run: |
        set -euo pipefail
        FRAGMENT="${GITHUB_WORKSPACE}/wild_gki.fragment"
        touch "$FRAGMENT"
        {
          echo "CONFIG_AMNEZIAWG=m"
          echo "CONFIG_AMNEZIAWG_DEBUG=n"
        } >> "$FRAGMENT"
        echo "--- AmneziaWG fragment ---"
        cat "$FRAGMENT"
